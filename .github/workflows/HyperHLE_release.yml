name: Build HyperHLE

on:
  workflow_dispatch:
    inputs:
      publish_hyperhle_release:
        description: Publish a HyperHLE release (after all builds succeed)
        type: boolean
        default: false
  push:
    branches: [ "trunk" ]
  pull_request:
    branches: [ "trunk" ]
  create: # for tags

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on trunk queue instead of cancelling each other: a cancelled run never
  # publishes its release, so frequent pushes could otherwise hold releases
  # back indefinitely. Queued runs start after the previous one finishes and
  # so see any tag it published.
  cancel-in-progress: ${{ github.ref != 'refs/heads/trunk' }}

jobs:
  build-osx:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            artifact: HyperHLE_macOS_x86_64
          - target: aarch64-apple-darwin
            runner: macos-15
            artifact: HyperHLE_macOS_AArch64
    runs-on: ${{ matrix.runner }}

    steps:  
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost  
        id: cache-boost  
        uses: actions/cache@main
        with:  
          path: vendor/boost  
          key: boost_1_81_0_macos  
          
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Download Boost  
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"  
        
      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
        name: Extract Boost  
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost  

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}

      # TestApp is built with LLVM 12 against the common-3.0 SDK, as in
      # touchHLE's CI. These steps were removed in 49d9d48e.
      - name: Try to get cached copy of LLVM
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        id: cache-llvm
        uses: actions/cache@main
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64

      - if: ${{ matrix.target == 'x86_64-apple-darwin' && steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Download LLVM
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"

      - if: ${{ matrix.target == 'x86_64-apple-darwin' && steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Extract LLVM
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm

      - name: Get copy of common-3.0-sdk
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: cd tests && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv

      - name: Test
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        run: cargo test --target ${{ matrix.target }}
        
      - name: Build  
        run: cargo build --target ${{ matrix.target }} --release

      - name: Create .app bundle and DMG
        # `hdiutil create` periodically fails on the `macos-15-arm64` GitHub
        # Actions runners with `hdiutil: create failed - Resource busy` when
        # Spotlight (`mds`/`mds_stores`) decides to index `touchHLE-dmg-src`
        # at the same moment hdiutil tries to snapshot it, or when a stale
        # `/Volumes/touchHLE` from a previous run hasn't fully detached.
        # Mirror the workaround Apple documents in TN2065 / `hdiutil(1)` —
        # detach any stray attachment, pass `-ov` so an existing image is
        # overwritten cleanly, and retry a few times. See
        # <https://developer.apple.com/library/archive/technotes/tn2065/_index.html>.
        run: |
          set -eu
          cd dev-scripts
          ./make-macos-bundle.sh \
            ../target/${{ matrix.target }}/release/touchHLE \
            "`cargo run --package touchHLE_version`" \
            "`cargo run --package touchHLE_version -- --branding`"
          mkdir touchHLE-dmg-src
          mv *.app touchHLE-dmg-src/
          # Forbid Spotlight from indexing the staging folder so it can't
          # race with hdiutil for an exclusive handle.
          touch touchHLE-dmg-src/.metadata_never_index || true
          # Tear down any stale mount left over from a previous run.
          if [ -d "/Volumes/touchHLE" ]; then
            hdiutil detach -force "/Volumes/touchHLE" || true
          fi
          # Retry hdiutil up to 5 times with growing back-off.
          attempt=1
          max_attempts=5
          until hdiutil create -ov -volname touchHLE \
              -srcfolder touchHLE-dmg-src touchHLE.dmg; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "hdiutil create still failed after $max_attempts attempts" >&2
              exit 1
            fi
            sleep_secs=$((attempt * 5))
            echo "hdiutil create failed (attempt $attempt); retrying in ${sleep_secs}s" >&2
            if [ -d "/Volumes/touchHLE" ]; then
              hdiutil detach -force "/Volumes/touchHLE" || true
            fi
            sleep "$sleep_secs"
            attempt=$((attempt + 1))
          done
          mv touchHLE.dmg ../touchHLE_${{ matrix.target }}.dmg
          
      - uses: actions/upload-artifact@main
        with:
          name: ${{ matrix.artifact }}
          path: touchHLE_${{ matrix.target }}.dmg

  build-linux:
    runs-on: ubuntu-latest
    env:
      # GCC 15 defaults to C23; bundled SDL2 uses bool/true/false as identifiers.
      # https://gcc.gnu.org/gcc-15/porting_to.html#c23
      CFLAGS: -std=gnu17

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        # SDL2 and openal-soft are built from source (the `static` feature uses
        # the `bundled` SDL2 build), so the development headers for the audio,
        # video and input backends they detect must be available.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build
        run: cargo build --release

      - name: Create bundle
        run: cd dev-scripts && ./make-linux-bundle.sh ../target/release/touchHLE && mv touchHLE_linux_bundle/ ..

      - uses: actions/upload-artifact@main
        with:
          name: HyperHLE_Linux_x86_64
          path: touchHLE_linux_bundle/

  build-android:
    runs-on: ubuntu-latest  

    steps:  
    - name: Checkout touchHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        fetch-depth: 0
        fetch-tags: true

    - name: Cache Rust build artifacts
      uses: actions/cache@main
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
          
    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor/boost  
        key: boost_1_81_0  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  

    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && mv vendor/boost_1_81_0 vendor/boost  

    - name: Try to get cached copy of cmake  
      id: cache-cmake  
      uses: actions/cache@main
      with:  
        path: vendor/cmake  
        key: cmake_3_31_6_linux  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Download Cmake  
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"  

    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}  
      name: Extract Cmake  
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake  

    - name: Install AArch64 Android Rust toolchain  
      run: rustup target add aarch64-linux-android  

    - name: Install cargo-ndk  
      run: cargo install cargo-ndk@3.5.4  

    - name: Try to get a cached copy of Gradle  
      id: cache-gradle  
      uses: actions/cache@main
      with:  
        path: gradle  
        key: gradle-8.11.1  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Download Gradle  
      run: curl -L -o gradle-8.11.1-bin.zip "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"  

    - if: ${{ steps.cache-gradle.outputs.cache-hit != 'true' }}  
      name: Extract Gradle  
      run: 7z -ogradle x gradle-8.11.1-bin.zip  

    - name: Try to get a cached copy of Android NDK  
      id: cache-android-ndk  
      uses: actions/cache@main
      with:  
        path: android-ndk  
        key: android-ndk-r25c  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Download Android NDK  
      run: curl -L -o android-ndk-r25c-linux.zip "https://dl.google.com/android/repository/android-ndk-r25c-linux.zip"  

    - if: ${{ steps.cache-android-ndk.outputs.cache-hit != 'true' }}  
      name: Extract Android NDK  
      run: 7z -oandroid-ndk -snld x android-ndk-r25c-linux.zip  

    - name: Link Android NDK  
      run: ln -s $PWD'/android-ndk/android-ndk-r25c' $ANDROID_SDK_ROOT'/ndk/25.2.9519653'  

    - name: Generate local.properties file  
      run: echo 'sdk.dir='$ANDROID_SDK_ROOT > android/local.properties  

    - name: Set up JDK 17  
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Build for Android  
      run: cd android && ../gradle/gradle-8.11.1/bin/gradle assembleRelease && mv app/build/outputs/apk/release/HyperHLE-Reborn-release.apk ../HyperHLE-Reborn.apk  
      env:  
        HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
        HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
        HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/25.2.9519653'  
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake  

    - name: Apply APK v3 key-rotation lineage (if configured)
      env:
        HYPERHLE_KEY_LINEAGE_B64: ${{ secrets.HYPERHLE_KEY_LINEAGE_B64 }}
        HYPERHLE_KEYSTORE_B64: ${{ secrets.HYPERHLE_KEYSTORE_B64 }}
        HYPERHLE_KEYSTORE_PASSWORD: ${{ secrets.HYPERHLE_KEYSTORE_PASSWORD }}
        HYPERHLE_KEY_ALIAS: ${{ secrets.HYPERHLE_KEY_ALIAS }}
      run: |
        set -euo pipefail
        if [ -z "${HYPERHLE_KEY_LINEAGE_B64:-}" ] || [ -z "${HYPERHLE_KEYSTORE_B64:-}" ]; then
          exit 0
        fi
        APKSIGNER="$(ls -1 "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n1)"
        KS_TMP="$(mktemp --suffix=.keystore)"
        LIN_TMP="$(mktemp --suffix=.lineage)"
        trap 'rm -f "$KS_TMP" "$LIN_TMP"' EXIT
        printf '%s' "$HYPERHLE_KEYSTORE_B64" | base64 -d > "$KS_TMP"
        printf '%s' "$HYPERHLE_KEY_LINEAGE_B64" | base64 -d > "$LIN_TMP"
        "$APKSIGNER" sign \
          --ks "$KS_TMP" \
          --ks-key-alias "${HYPERHLE_KEY_ALIAS:-hyperhle}" \
          --ks-pass env:HYPERHLE_KEYSTORE_PASSWORD \
          --v1-signing-enabled true \
          --v2-signing-enabled true \
          --v3-signing-enabled true \
          --lineage "$LIN_TMP" \
          HyperHLE-Reborn.apk

    - uses: actions/upload-artifact@main
      with:  
        name: HyperHLE_Android_AArch64  
        path: HyperHLE-Reborn.apk

  build-ios:
    # The iOS app (platform/ios) and its packaging come from Applesauce
    # (https://github.com/johnny901901901/Applesauce). This builds the three
    # unsigned/fakesigned IPAs it ships and uploads each one on its own.
    #
    # It waits for check-hyperhle-release only to learn the version a release
    # build will be tagged with; that job is skipped outside trunk pushes and
    # manual runs, and the iOS build runs regardless.
    needs: [check-hyperhle-release]
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    env:
      HYPERHLE_VERSION: ${{ needs.check-hyperhle-release.outputs.should_release == 'true' && needs.check-hyperhle-release.outputs.version || '' }}

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          # Full history and tags: the app version comes from the latest
          # release tag and the build number from the commit count.
          fetch-depth: 0
          fetch-tags: true

      - name: Select the newest installed Xcode
        run: |
          set -eu
          xcode=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$xcode" ]; then
            sudo xcode-select -s "$xcode/Contents/Developer"
          fi
          echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install build tools
        run: brew install ninja ldid

      - name: Install AArch64 iOS Rust toolchain
        run: rustup target add aarch64-apple-ios

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master
        with:
          workspaces: ". -> build/rust-ios-native"

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_macos

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build shared SDL2 for iOS
        run: sh platform/ios/scripts/build-sdl-shared.sh iphoneos

      - name: Build the iOS app
        run: sh platform/ios/scripts/build-host.sh iphoneos Release

      - name: Package the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/package-ipa.sh
          sh platform/ios/scripts/package-ipa.sh --trollstore
          sh platform/ios/scripts/package-ipa.sh --trollstore-permanent-jit

      - name: Verify the IPAs
        run: |
          set -eu
          sh platform/ios/scripts/verify-ipa.sh dist/HyperHLE-iOS-unsigned.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore dist/HyperHLE-iOS-trollstore.ipa
          sh platform/ios/scripts/verify-ipa.sh --trollstore-permanent-jit dist/HyperHLE-iOS-trollstore-permanent-jit.ipa

      # Each IPA is uploaded as-is rather than wrapped in a zip.
      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-unsigned.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-trollstore.ipa
          archive: false

      - uses: actions/upload-artifact@main
        with:
          path: dist/HyperHLE-iOS-trollstore-permanent-jit.ipa
          archive: false

  build-win:
    # Like build-ios, this waits for check-hyperhle-release only to learn the
    # version a release build will be tagged with (for the installer), and
    # runs regardless.
    needs: [check-hyperhle-release]
    if: ${{ !cancelled() }}
    runs-on: windows-2022
    env:
      HYPERHLE_VERSION: ${{ needs.check-hyperhle-release.outputs.should_release == 'true' && needs.check-hyperhle-release.outputs.version || '' }}

    steps:
    - name: Checkout touchHLE
      uses: actions/checkout@main
      with:
        submodules: recursive
        
    - name: Cache Rust build artifacts
      uses: Swatinem/rust-cache@master

    - name: Try to get cached copy of Boost  
      id: cache-boost  
      uses: actions/cache@main
      with:  
        path: vendor\boost  
        key: boost_1_81_0  
        
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Download Boost  
      run: curl -L -o boost_1_81_0.7z "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.7z"  
      
    - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}  
      name: Extract Boost  
      run: 7z -ovendor x boost_1_81_0.7z && ren vendor\boost_1_81_0 boost  

    - name: Setup CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~3.29.0"

    - name: Build  
      run: cargo build --release  

    - name: Create bundle  
      shell: bash  
      run: cd dev-scripts && ./make-windows-bundle.sh ../target/release/touchHLE.exe && mv touchHLE_windows_bundle/ ..  
      
    - uses: actions/upload-artifact@main
      with:
        name: HyperHLE_Windows_x86_64
        path: touchHLE_windows_bundle/

    - name: Build installer
      # Inno Setup 6 ships with the windows-2022 runner image; install it only
      # if the image ever stops including it. PowerShell rather than bash, as
      # MSYS would rewrite ISCC's /D and /O arguments into paths.
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
        if (-not (Test-Path $iscc)) {
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        if ($env:HYPERHLE_VERSION) {
          $version = $env:HYPERHLE_VERSION
        } else {
          $version = (cargo run --quiet --package touchHLE_version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        if ($version -notmatch '(\d+)\.(\d+)\.(\d+)') {
          throw "Can't get a numeric version from '$version'"
        }
        $numeric = $Matches[0]
        & $iscc "/DAppVersion=$version" "/DAppNumericVersion=$numeric" `
          "/DBundleDir=..\touchHLE_windows_bundle" "/DOutputDir=.." `
          dev-scripts\hyperhle-installer.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    # Uploaded as-is rather than wrapped in a zip.
    - uses: actions/upload-artifact@main
      with:
        path: HyperHLE_Windows_x86_64_Setup.exe
        archive: false

  check-hyperhle-release:
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/trunk') ||
      github.event_name == 'workflow_dispatch'
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      changelog_from: ${{ steps.check.outputs.changelog_from }}
      changelog_limit: ${{ steps.check.outputs.changelog_limit }}
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Check whether a HyperHLE release is due
        id: check
        env:
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
        run: ./dev-scripts/hyperhle-should-release.sh

  publish-hyperhle-release:
    needs: [check-hyperhle-release, build-osx, build-linux, build-android, build-win, build-ios]
    if: >-
      needs.check-hyperhle-release.result == 'success' &&
      needs.check-hyperhle-release.outputs.should_release == 'true' &&
      needs.build-osx.result == 'success' &&
      needs.build-linux.result == 'success' &&
      needs.build-android.result == 'success' &&
      needs.build-win.result == 'success' &&
      needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_macOS_x86_64
          path: artifacts/macos-x86_64
      - name: Download macOS Apple Silicon artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_macOS_AArch64
          path: artifacts/macos-aarch64
      - name: Download Android artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Android_AArch64
          path: artifacts/android
      - name: Download Windows artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Windows_x86_64
          path: artifacts/windows
      - name: Download Windows installer
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Windows_x86_64_Setup.exe
          path: artifacts/windows-installer
      - name: Download Linux artifact
        uses: actions/download-artifact@main
        with:
          name: HyperHLE_Linux_x86_64
          path: artifacts/linux
      # Unzipped artifacts (upload-artifact archive: false) are documented to
      # download by their exact file name, so fetch each IPA by name.
      - name: Download iOS unsigned IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-unsigned.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-trollstore.ipa
          path: artifacts/ios
      - name: Download iOS TrollStore permanent-JIT IPA
        uses: actions/download-artifact@main
        with:
          name: HyperHLE-iOS-trollstore-permanent-jit.ipa
          path: artifacts/ios
      - name: Install packaging tools
        run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pandoc zip
      - name: Package HyperHLE release files
        env:
          # Lets the changelog look up each commit author's GitHub username.
          GH_TOKEN: ${{ github.token }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          FORCE_HYPERHLE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_hyperhle_release && 'true' || '' }}
          VERSION: ${{ needs.check-hyperhle-release.outputs.version }}
          CHANGELOG_FROM: ${{ needs.check-hyperhle-release.outputs.changelog_from }}
          CHANGELOG_LIMIT: ${{ needs.check-hyperhle-release.outputs.changelog_limit }}
        run: ./dev-scripts/package-hyperhle-release.sh "$VERSION" "$CHANGELOG_FROM"
      - name: Publish HyperHLE release
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ needs.check-hyperhle-release.outputs.version }}
          # Tag the commit that was built, not whatever trunk points at by now.
          target_commitish: ${{ github.sha }}
          name: HyperHLE ${{ needs.check-hyperhle-release.outputs.version }}
          body_path: release/RELEASE_NOTES.md
          files: |
            release/HyperHLE_*.zip
            release/HyperHLE_Windows_x86_64_Setup.exe
            release/HyperHLE-iOS-*.ipa
          fail_on_unmatched_files: true
